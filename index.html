<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Real I-frame-removal datamosh, entirely in your phone's browser.">
<title>MOSH</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Behind everything, dim: the datamosh field, then (after a mosh) the moshed video -->
<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="bgmosh" aria-hidden="true" hidden></canvas>

<main>
  <header>
    <h1 class="sr-only">MOSH</h1>
    <canvas id="logo" aria-hidden="true"></canvas>
    <p class="sub">I-FRAME REMOVAL // REAL DATAMOSH</p>
  </header>

  <section class="pick">
    <div class="slot">
      <div class="file" id="cardA" role="button" tabindex="0" aria-label="Clip A: pick from the gallery">
        <div class="thumb" id="thumbA"></div>
        <span class="tag">A</span>
        <span class="what">THE PICTURE<br><small>gets smeared</small></span>
        <span class="name" id="nameA">tap to pick</span>
      </div>
      <div class="slot-btns">
        <button data-act="gallery" data-slot="A">GALLERY</button>
        <button data-act="gif" data-slot="A">GIFCITIES</button>
        <button data-act="dice" data-slot="A" aria-label="Random GIF for A">🎲</button>
      </div>
      <input type="file" id="fileA" accept="video/*,image/gif" hidden>
    </div>
    <div class="slot">
      <div class="file" id="cardB" role="button" tabindex="0" aria-label="Clip B: pick from the gallery">
        <div class="thumb" id="thumbB"></div>
        <span class="tag">B</span>
        <span class="what">THE MOTION<br><small>drags it around</small></span>
        <span class="name" id="nameB">tap to pick</span>
      </div>
      <div class="slot-btns">
        <button data-act="gallery" data-slot="B">GALLERY</button>
        <button data-act="gif" data-slot="B">GIFCITIES</button>
        <button data-act="dice" data-slot="B" aria-label="Random GIF for B">🎲</button>
      </div>
      <input type="file" id="fileB" accept="video/*,image/gif" hidden>
    </div>
  </section>

  <div class="randrow">
    <button id="randBoth" class="rand">🎲 RANDOM BOTH</button>
    <label class="chk"><input type="checkbox" id="randSettings" checked> random settings</label>
    <label class="chk"><input type="checkbox" id="autoMosh"> auto-MOSH</label>
  </div>

  <p class="warn" id="warn" hidden></p>

  <section class="controls">
    <div class="ctl">
      <div class="row"><label for="keepA">KEEP OF A</label><output id="keepAOut">2.0 s</output></div>
      <input type="range" id="keepA" min="0.3" max="20" step="0.1" value="2">
    </div>
  </section>

  <button id="mosh" class="big" disabled>MOSH</button>

  <div class="progress" aria-live="polite">
    <div class="bar" id="bar"></div>
    <span id="status">PICK TWO CLIPS</span>
  </div>

  <!-- The result: the live screen (pads + FX play here); a plain video only if that can't run -->
  <section id="p-play" class="result" hidden></section>
  <video id="out" controls playsinline loop hidden></video>
  <button id="save" class="save" hidden>SAVE / SHARE</button>

  <!-- Everything else: collapsible, closed by default, remembered -->
  <details class="sec" data-sec="pads"><summary>PADS</summary><div id="p-pads" class="sec-body"></div></details>
  <details class="sec" data-sec="fx"><summary>FX</summary><div id="p-fx" class="sec-body"></div></details>
  <details class="sec" data-sec="chain"><summary>CHAIN</summary><div id="daisy" class="sec-body daisy"></div></details>
  <details class="sec log" data-sec="log"><summary>LOG</summary><pre id="log"></pre></details>

  <p class="foot">Runs entirely on your phone. Nothing is uploaded.<br>First run downloads the ffmpeg engine (~31 MB).</p>
</main>
<div class="scan" aria-hidden="true"></div>
<div class="noise" aria-hidden="true"></div>
<script type="module" src="app.js"></script>
</body>
</html>
