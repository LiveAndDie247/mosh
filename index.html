<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Real I-frame-removal datamosh, entirely in your phone's browser.">
<title>MOSH</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- The living background: a datamosh field you can drag to smear -->
<canvas id="bg" aria-hidden="true"></canvas>
<!-- After a mosh: the page background IS the moshed video, live from the pads (with their FX) -->
<canvas id="bgmosh" aria-hidden="true" hidden></canvas>

<main>
  <header>
    <h1 class="sr-only">MOSH</h1>
    <canvas id="logo" aria-hidden="true"></canvas>
    <p class="sub">I-FRAME REMOVAL // REAL DATAMOSH</p>
  </header>

  <section class="panel" id="p-clips">
    <h2 class="ph"><span>01</span> CLIPS</h2>
    <div class="pick">
      <div class="slot">
        <div class="file" id="cardA" role="button" tabindex="0" aria-label="Clip A: pick from the gallery">
          <div class="thumb" id="thumbA"></div>
          <span class="tag">A</span>
          <span class="what">THE PICTURE<br><small>gets smeared</small></span>
          <span class="name" id="nameA">empty</span>
        </div>
        <div class="slot-btns">
          <button data-act="gallery" data-slot="A">GALLERY</button>
          <button data-act="gif" data-slot="A">GIFCITIES</button>
          <button data-act="dice" data-slot="A" aria-label="Random GIF for A">🎲</button>
        </div>
        <input type="file" id="fileA" accept="video/*,image/gif" hidden>
      </div>
      <div class="slot">
        <div class="file" id="cardB" role="button" tabindex="0" aria-label="Clip B: pick from the gallery">
          <div class="thumb" id="thumbB"></div>
          <span class="tag">B</span>
          <span class="what">THE MOTION<br><small>drags it around</small></span>
          <span class="name" id="nameB">empty</span>
        </div>
        <div class="slot-btns">
          <button data-act="gallery" data-slot="B">GALLERY</button>
          <button data-act="gif" data-slot="B">GIFCITIES</button>
          <button data-act="dice" data-slot="B" aria-label="Random GIF for B">🎲</button>
        </div>
        <input type="file" id="fileB" accept="video/*,image/gif" hidden>
      </div>
    </div>
    <div class="randrow">
      <button id="randBoth" class="rand">🎲 RANDOM BOTH</button>
      <label class="chk"><input type="checkbox" id="randSettings" checked> random settings</label>
    </div>
    <label class="chk automosh"><input type="checkbox" id="autoMosh"> mosh right after RANDOM BOTH</label>
    <p class="warn" id="warn" hidden></p>
  </section>

  <section class="panel" id="p-mosh">
    <h2 class="ph"><span>02</span> MOSH</h2>
    <div class="controls">
      <div class="ctl">
        <div class="row"><label for="keepA">KEEP OF A</label><output id="keepAOut">2.0 s</output></div>
        <input type="range" id="keepA" min="0.3" max="20" step="0.1" value="2">
      </div>
    </div>
    <button id="mosh" class="big" disabled>MOSH</button>
    <div class="progress" aria-live="polite">
      <div class="bar" id="bar"></div>
      <span id="status">PICK TWO CLIPS</span>
    </div>
    <video id="out" controls playsinline loop hidden></video>
    <button id="save" class="save" hidden>SAVE / SHARE THE MOSH</button>
  </section>

  <section class="panel pads-wrap" id="pads" aria-label="Live pads"></section>

  <details class="log"><summary>LOG</summary><pre id="log"></pre></details>
  <p class="foot">Runs entirely on your phone. Nothing is uploaded.<br>First run downloads the ffmpeg engine (~31 MB).<br>Drag the background to smear it.</p>
</main>
<div class="scan" aria-hidden="true"></div>
<div class="noise" aria-hidden="true"></div>
<script type="module" src="app.js"></script>
</body>
</html>
