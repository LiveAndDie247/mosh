# Wraps https://liveanddie247.github.io/mosh/ into an installable Android APK
# (a Trusted Web Activity: the site runs inside Chrome) and publishes it as a release.
#
# Optional signing: add repo secrets MOSH_KEYSTORE_BASE64 (base64 of a .jks),
# MOSH_KEYSTORE_PASSWORD, MOSH_KEY_ALIAS, MOSH_KEY_PASSWORD. Without them the APK is
# signed with the runner's debug key (installs fine; updates need an uninstall first).
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/apk.yml", "icons/**", "manifest.webmanifest"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Launcher icon (from the web app's icon)
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp icons/icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.MOSH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mosh.jks"
            echo "MOSH_KEYSTORE=$RUNNER_TEMP/mosh.jks" >> "$GITHUB_ENV"
            echo "Signing with the MOSH_KEYSTORE_BASE64 key"
          else
            echo "No MOSH_KEYSTORE_BASE64 secret: signing with a debug key"
          fi

      - name: Build
        working-directory: android
        env:
          MOSH_KEYSTORE_PASSWORD: ${{ secrets.MOSH_KEYSTORE_PASSWORD }}
          MOSH_KEY_ALIAS: ${{ secrets.MOSH_KEY_ALIAS }}
          MOSH_KEY_PASSWORD: ${{ secrets.MOSH_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease -PversionCode=${{ github.run_number }}

      - name: Collect the APK and its signing fingerprint
        run: |
          APK="mosh-${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          SHA=$("$BT/apksigner" verify --print-certs "$APK" | sed -n 's/.*SHA-256 digest: //p' | head -1)
          {
            echo "MOSH for Android, build ${{ github.run_number }} (${GITHUB_SHA::7})."
            echo
            echo "Install: download \`$APK\` on the phone and open it (allow installs from this source)."
            echo "It opens https://liveanddie247.github.io/mosh/ as an app, inside Chrome."
            echo
            echo "Signing certificate SHA-256 (for assetlinks.json): \`$SHA\`"
          } > release.md
          cat release.md

      - uses: actions/upload-artifact@v4
        with:
          name: mosh-apk
          path: mosh-*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: MOSH APK ${{ github.run_number }}
          body_path: release.md
          files: mosh-*.apk
          make_latest: true
